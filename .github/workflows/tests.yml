name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r tests/requirements-dev.txt
      - name: Run unit tests
        run: pytest tests/ -v
      - name: Smoke build of the example site
        run: |
          python generator.py --content content --output /tmp/build --clean
          test -f /tmp/build/index.html
          test -f /tmp/build/sitemap.xml
          test -f /tmp/build/feed.xml
          test -f /tmp/build/404.html
