<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>{% if title %}{{ title }} {% else %} {{ config.site.title }} {% endif %}</title>
    <link rel="stylesheet" href="{{ css_rel_path }}{{ config.css_filename }}">
    <link rel="icon" href="{{ css_rel_path }}favicon.ico" type="image/x-icon">
    <meta charset="utf-8">
    <meta name="resource-type" content="document">
    <meta name="description" content="{{ config.site.description }}">
  </head>
  <body>
    <section class="pagegen">
      <hgroup>
        <header>
          {% if back_link %}
          <h1><a href="{{ back_link }}" style="color:black; text-decoration:none;">
            {% if title %}{{ title }} {% else %} {{ config.site.title }} {% endif %}
          </a></h1>
          {% else %}
          <h1>{% if title %}{{ title }} {% else %} {{ config.site.title }} {% endif %}</h1>
          <p style="text-align:center;"><img src="{{ css_rel_path }}img/logo.png" alt="{{ config.site.title }} Logo" width="128"></p>
          {% endif %}
        </header>
      </hgroup>

{% block content %}{% endblock %}

      <footer>
        <p><a href="{{ home_link }}index.html">Home</a> | Generated with &lt;3 by <a href="https://github.com/Crap-Solutions/pagegen.py">pagegen.py</a></p>
      </footer>
    </section>
  </body>
</html>
