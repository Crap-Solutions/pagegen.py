{% extends "base.html" %}

{% block content %}
{% if blog_content %}
      <section class="introduction">
        {{ blog_content | safe }}
      </section>
{% endif %}

      <section class="information">
        <h3>Posts</h3>
        <ul class="indent-list">
{% for post in posts %}
          <li><a href="{{ post.slug }}.html">{{ post.metadata.date }} - {{ post.metadata.title }}</a></li>
{% endfor %}
        </ul>
      </section>
{% endblock %}
